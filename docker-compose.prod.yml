services:
  postgres:
    image: postgres:16-alpine
    container_name: nestora_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-nestora_db}
    volumes:
      - nestora_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nestora_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nestora_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nestora_prod_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-nestora_db}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      UPLOAD_DIR: uploads
    volumes:
      # Host disk storage mount: zero cloud costs, persists across all container updates
      - ./backend/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/v1/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - nestora_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: nestora_prod_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    volumes:
      # Mount uploads directory directly to Nginx for fast static streaming
      - ./backend/uploads:/app/uploads:ro
    networks:
      - nestora_network

volumes:
  nestora_prod_pgdata:

networks:
  nestora_network:
    driver: bridge
