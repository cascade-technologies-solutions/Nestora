services:
  postgres:
    image: postgres:16-alpine
    container_name: nestora_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: nestora_db
    ports:
      - "5435:5432"
    volumes:
      - nestora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nestora_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nestora_pgdata:
