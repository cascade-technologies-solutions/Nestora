# ==============================================================================
# Nestora — Render Blueprint Deployment Specification
# Deploys Nestora Backend API to Render's Free Web Service Tier ($0/mo)
# ==============================================================================

services:
  - type: web
    name: nestora-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run migrate && npm run seed && npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SEED_SUPERADMIN_USERNAME
        value: superadmin
      - key: SEED_SUPERADMIN_PASSWORD
        value: NestoraSuperAdmin2026!
      - key: CORS_ORIGINS
        value: "*"
      - key: STORAGE_PROVIDER
        value: s3
      - key: AWS_ENDPOINT_URL_S3
        value: https://br-old-glade-b3ysfmud.storage.c-4.ap-southeast-1.aws.neon.tech
